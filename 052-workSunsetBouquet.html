<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイトルを入力</title>
    <link rel="stylesheet" href="slide-theme-tokens.css">
    <style>
        :root {
            --eff-accent: #334155;
            --eff-accent-border: #1e293b;
            --eff-text-title: #334155;
            --eff-bg-slide: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--page-canvas-bg);
            font-family: var(--font-sans);
        }

        .slide {
            width: var(--slide-width);
            height: var(--slide-height);
            background: var(--eff-bg-slide);
            padding: 24px 32px 28px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            box-shadow: var(--slide-shadow);
        }

        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 20px;
            border: 1px solid var(--eff-accent-border);
            border-radius: 999px;
            background: #ffffff;
            color: var(--eff-accent);
            font-size: 14px;
            font-weight: var(--font-weight-semibold);
            letter-spacing: 0.02em;
            flex-shrink: 0;
        }

        .photo {
            margin: 16px 0 0;
            flex: 1;
            width: 100%;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            overflow: hidden;
        }

        .photo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        .work-title {
            margin: 18px 0 0;
            width: 100%;
            font-size: 26px;
            font-weight: var(--font-weight-bold);
            color: var(--eff-text-title);
            line-height: 1.4;
            letter-spacing: 0.08em;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="slide" role="document" aria-label="参考資料スライド">
        <div class="pill">Reference</div>

        <figure class="photo">
            <img
                src="img/work-sunset-bouquet.jpg"
                width="6177"
                height="4118"
                alt="夕暮れの干潟で花を抱えるポートレート写真"
                decoding="async"
                fetchpriority="high"
            >
        </figure>

        <h1 class="work-title">タイトルを入力</h1>
    </div>
</body>
</html>
