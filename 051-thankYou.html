<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ご清聴ありがとうございました</title>
    <link rel="stylesheet" href="slide-theme-tokens.css">
    <style>
        :root {
            --eff-accent: #334155;
            --eff-accent-border: #1e293b;
            --eff-text-title: #0f172a;
            --eff-text-body: #64748b;
            --eff-bg-slide: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--page-canvas-bg);
            font-family: var(--font-sans);
        }

        .slide {
            width: var(--slide-width);
            height: var(--slide-height);
            background: var(--eff-bg-slide);
            padding: 24px 32px 28px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            box-shadow: var(--slide-shadow);
        }

        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 20px;
            border: 1px solid var(--eff-accent-border);
            border-radius: 999px;
            background: #ffffff;
            color: var(--eff-accent);
            font-size: 14px;
            font-weight: var(--font-weight-semibold);
            letter-spacing: 0.02em;
            flex-shrink: 0;
        }

        .closing-body {
            flex: 1;
            width: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .rule {
            width: 48px;
            height: 3px;
            margin: 0 0 32px;
            border-radius: 999px;
            background: var(--eff-accent);
        }

        .main-title {
            margin: 0;
            max-width: 820px;
            font-size: 36px;
            font-weight: var(--font-weight-bold);
            color: var(--eff-text-title);
            line-height: 1.45;
            letter-spacing: 0.04em;
        }

        .subtitle {
            margin: 28px 0 0;
            font-size: 22px;
            font-weight: var(--font-weight-semibold);
            color: var(--eff-text-body);
            line-height: 1.5;
            letter-spacing: 0.08em;
        }
    </style>
</head>
<body>
    <div class="slide" role="document" aria-label="クロージング ご清聴ありがとうございました">
        <div class="pill">Closing</div>
        <div class="closing-body">
            <div class="rule" aria-hidden="true"></div>
            <h1 class="main-title">ご清聴ありがとうございました。</h1>
            <p class="subtitle">質疑応答</p>
        </div>
    </div>
</body>
</html>
