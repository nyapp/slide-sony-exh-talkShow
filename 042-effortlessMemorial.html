<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エフォートレス・メモリアル</title>
    <link rel="stylesheet" href="slide-theme-tokens.css">
    <style>
        :root {
            --eff-accent: #334155;
            --eff-text-title: #0f172a;
            --eff-bg-slide: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--page-canvas-bg);
            font-family: var(--font-sans);
        }

        .slide {
            width: var(--slide-width);
            height: var(--slide-height);
            background: var(--eff-bg-slide);
            padding: 24px 32px 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: var(--slide-shadow);
        }

        .rule {
            width: 48px;
            height: 3px;
            margin: 0 0 32px;
            border-radius: 999px;
            background: var(--eff-accent);
        }

        .main-title {
            margin: 0;
            max-width: 820px;
            font-size: 44px;
            font-weight: var(--font-weight-bold);
            color: var(--eff-text-title);
            line-height: 1.45;
            letter-spacing: 0.08em;
        }
    </style>
</head>
<body>
    <div class="slide" role="document" aria-label="エフォートレス・メモリアル">
        <div class="rule" aria-hidden="true"></div>
        <h1 class="main-title">エフォートレス・メモリアル</h1>
    </div>
</body>
</html>
