<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Slide Deck</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            color: rgba(255, 255, 255, 0.88);
            font-family: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        body {
            /* ダブルタップズーム・慣性スクロールを抑えてスワイプ操作に専念させる */
            touch-action: none;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }

        .stage {
            width: 100vw;
            height: 100vh;
            /* モバイルのアドレスバー伸縮で 100vh がはみ出すのを防ぐ */
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .frame-wrap {
            width: 960px;
            height: 540px;
            position: relative;
            flex: none;
            transform-origin: center center;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.45);
            border-radius: 4px;
            overflow: hidden;
            background: #020617;
        }

        .frame-wrap iframe {
            display: block;
            width: 960px;
            height: 540px;
            border: 0;
            background: #fff;
            /* クリックで子 document にフォーカスが移り親のキー操作が効かなくなるのを防ぐ */
            pointer-events: none;
        }

        /* タップ／スワイプを受け取る透明レイヤ（iframe より上） */
        .touch-layer {
            position: fixed;
            inset: 0;
            z-index: 5;
            /* 二本指のピンチズームだけブラウザに渡し、一本指スワイプは自前で処理する */
            touch-action: pinch-zoom;
        }

        .hud {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 6;
            padding: 10px 16px 14px;
            padding-bottom: calc(14px + env(safe-area-inset-bottom));
            padding-left: calc(16px + env(safe-area-inset-left));
            padding-right: calc(16px + env(safe-area-inset-right));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
            letter-spacing: 0.02em;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.55), transparent);
            pointer-events: none;
            user-select: none;
        }

        .hud kbd {
            display: inline-block;
            padding: 2px 6px;
            margin: 0 1px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            font-size: 11px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.08);
        }

        .hud-muted {
            color: rgba(255, 255, 255, 0.55);
            font-size: 12px;
        }

        .hud-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.55);
        }

        .hud-status .is-on {
            color: rgba(134, 239, 172, 0.95);
        }

        .hud-actions {
            display: none;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }

        .hud-btn {
            appearance: none;
            min-width: 44px;
            min-height: 44px;
            padding: 0 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            font: inherit;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
        }

        .hud-btn:active {
            background: rgba(255, 255, 255, 0.22);
        }

        .hud-btn.is-on {
            border-color: rgba(134, 239, 172, 0.6);
            color: rgba(134, 239, 172, 0.95);
        }

        .hud-btn[hidden] {
            display: none;
        }

        .error-banner {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            max-width: min(560px, calc(100vw - 24px));
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(180, 40, 40, 0.92);
            color: #fff;
            font-size: 13px;
            line-height: 1.45;
            display: none;
            z-index: 10;
        }

        .error-banner.is-visible {
            display: block;
        }

        /* --- タッチ端末・小画面：キーボード表記を畳んでボタン操作に切り替える --- */
        @media (max-width: 820px), (pointer: coarse) {
            .stage {
                padding: 8px;
            }

            .hud {
                padding: 8px 10px 10px;
                padding-bottom: calc(10px + env(safe-area-inset-bottom));
                padding-left: calc(10px + env(safe-area-inset-left));
                padding-right: calc(10px + env(safe-area-inset-right));
                gap: 8px;
                font-size: 12px;
            }

            .hud-keys {
                display: none;
            }

            .hud-actions {
                display: flex;
            }

            .hud-status {
                font-size: 11px;
                gap: 6px;
            }
        }

        /* 横持ちスマホなど背の低い画面：HUD を薄くしてスライドの取り分を増やす */
        @media (max-height: 430px) {
            .hud {
                padding: 4px 10px 6px;
                padding-bottom: calc(6px + env(safe-area-inset-bottom));
            }

            .hud-btn {
                min-width: 38px;
                min-height: 36px;
                padding: 0 8px;
            }
        }

        /* 横幅の狭い端末では自動再生／ループの文字表記まで省いてボタンに任せる */
        @media (max-width: 480px) {
            .hud-status {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="error" class="error-banner" role="status" aria-live="polite"></div>
    <div class="stage">
        <div id="frameWrap" class="frame-wrap">
            <iframe id="deckFrame" title="現在のスライド" src="about:blank"></iframe>
        </div>
    </div>
    <div id="touchLayer" class="touch-layer" aria-hidden="true"></div>
    <div class="hud">
        <span id="counter" aria-live="polite">— / —</span>
        <span id="status" class="hud-status" aria-hidden="true">
            <span id="autoplayStatus">自動再生 OFF</span>
            <span aria-hidden="true">·</span>
            <span id="loopStatus">ループ OFF</span>
        </span>
        <span class="hud-muted hud-keys" aria-hidden="true"><kbd>→</kbd> <kbd>Space</kbd> 次 · <kbd>←</kbd> 前 · <kbd>A</kbd> 自動再生 · <kbd>L</kbd> ループ · <kbd>F</kbd> 全画面</span>
        <span class="hud-actions">
            <button type="button" class="hud-btn" id="prevBtn" aria-label="前のスライド">‹</button>
            <button type="button" class="hud-btn" id="nextBtn" aria-label="次のスライド">›</button>
            <button type="button" class="hud-btn" id="rotateBtn" aria-label="スライドを回転して大きく表示">⟲</button>
            <button type="button" class="hud-btn" id="autoBtn" aria-label="自動再生">▶</button>
            <button type="button" class="hud-btn" id="loopBtn" aria-label="ループ">↻</button>
            <button type="button" class="hud-btn" id="fsBtn" aria-label="全画面">⛶</button>
        </span>
    </div>

    <!-- SLIDE_DECK_URLS:BEGIN -->
    <script>
    window.__SLIDE_DECK_URLS__ = [
        "000-title.html",
        "010-projectCommunity.html",
        "020-aboutSchool.html",
        "025-profile.html",
        "030-threeStepsOfOurProject.html",
        "040-whyAreWeHere.html",
        "045-threeBalances.html",
        "046-workSummer.html",
        "047-workFutariMonogatari.html",
        "048-workFutariRashiku.html",
        "049-workMelonSoda.html",
    ];
    </script>
    <!-- SLIDE_DECK_URLS:END -->
    <script>
        (function () {
            const SLIDE_W = 960;
            const SLIDE_H = 540;
            const AUTOPLAY_INTERVAL_MS = 5000;
            const SWIPE_MIN_PX = 40;
            const TAP_MAX_PX = 10;
            const urls = Array.isArray(window.__SLIDE_DECK_URLS__) ? window.__SLIDE_DECK_URLS__ : [];
            const frame = document.getElementById("deckFrame");
            const frameWrap = document.getElementById("frameWrap");
            const counter = document.getElementById("counter");
            const autoplayStatus = document.getElementById("autoplayStatus");
            const loopStatus = document.getElementById("loopStatus");
            const errorEl = document.getElementById("error");
            const touchLayer = document.getElementById("touchLayer");
            const hud = document.querySelector(".hud");
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");
            const rotateBtn = document.getElementById("rotateBtn");
            const autoBtn = document.getElementById("autoBtn");
            const loopBtn = document.getElementById("loopBtn");
            const fsBtn = document.getElementById("fsBtn");

            let index = 0;
            let autoplayEnabled = false;
            let loopEnabled = false;
            let autoplayTimer = null;
            /* このスケールを下回ると 960px 設計の文字が読めなくなる、という目安 */
            const READABLE_SCALE = 0.55;
            /* "auto" = 縦持ちで小さすぎるときだけ回転、"on"/"off" = ユーザーが明示指定 */
            let rotateMode = "auto";
            let rotated = false;

            function showError(msg) {
                errorEl.textContent = msg;
                errorEl.classList.add("is-visible");
            }

            if (urls.length === 0) {
                showError("スライド一覧が空です。三桁プレフィックスの .html を追加するか、python3 sync-slide-deck.py で index.html を同期してください。");
                counter.textContent = "0 / 0";
                return;
            }

            function isCompact() {
                return window.matchMedia("(max-width: 820px), (pointer: coarse)").matches;
            }

            function applyScale() {
                /* ピンチズーム中は拡大率を測り直さない（ズームと再スケールが競合するため） */
                if (window.visualViewport && window.visualViewport.scale > 1.01) return;

                const compact = isCompact();
                const padX = compact ? 8 : 16;
                const padTop = compact ? 8 : 12;
                /* 下部 HUD（枚数・操作ボタン）とスライドが重ならないよう実測して確保 */
                const padBottom = (hud ? hud.offsetHeight : 44) + 6;
                /* 100dvh 相当。visualViewport があればアドレスバー分を正確に引く */
                const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
                const vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
                /* 非表示タブなどで 0 が返るときは、壊れた倍率を書き込まずに現状維持 */
                if (vw < 1 || vh < 1) return;
                const availW = Math.max(1, vw - padX * 2);
                const availH = Math.max(1, vh - padTop - padBottom);

                /* 以前は Math.min(1, …) で「拡大しない」上限があり、大画面では常に余白が出ていた */
                const flat = Math.min(availW / SLIDE_W, availH / SLIDE_H);
                /* 90 度回した場合は幅と高さが入れ替わる */
                const turned = Math.min(availW / SLIDE_H, availH / SLIDE_W);

                if (rotateMode === "on") {
                    rotated = true;
                } else if (rotateMode === "off") {
                    rotated = false;
                } else {
                    /* 縦持ちで、そのままでは小さすぎ、かつ回すと明確に大きくなるときだけ自動回転。
                       タブレットのように縦でも十分読める場合は回さない。 */
                    rotated = availH > availW && flat < READABLE_SCALE && turned > flat * 1.2;
                }

                const s = rotated ? turned : flat;
                frameWrap.style.transform = rotated
                    ? "rotate(90deg) scale(" + s + ")"
                    : "scale(" + s + ")";
                rotateBtn.classList.toggle("is-on", rotated);
                rotateBtn.setAttribute("aria-pressed", rotated ? "true" : "false");
            }

            function updateCounter() {
                counter.textContent = index + 1 + " / " + urls.length;
            }

            function updateStatusHud() {
                autoplayStatus.textContent = autoplayEnabled
                    ? "自動再生 ON (" + AUTOPLAY_INTERVAL_MS / 1000 + "s)"
                    : "自動再生 OFF";
                autoplayStatus.classList.toggle("is-on", autoplayEnabled);
                loopStatus.textContent = loopEnabled ? "ループ ON" : "ループ OFF";
                loopStatus.classList.toggle("is-on", loopEnabled);
                autoBtn.textContent = autoplayEnabled ? "❚❚" : "▶";
                autoBtn.classList.toggle("is-on", autoplayEnabled);
                autoBtn.setAttribute("aria-pressed", autoplayEnabled ? "true" : "false");
                loopBtn.classList.toggle("is-on", loopEnabled);
                loopBtn.setAttribute("aria-pressed", loopEnabled ? "true" : "false");
            }

            function clearAutoplayTimer() {
                if (autoplayTimer !== null) {
                    clearTimeout(autoplayTimer);
                    autoplayTimer = null;
                }
            }

            function scheduleAutoplay() {
                clearAutoplayTimer();
                if (!autoplayEnabled) return;
                autoplayTimer = setTimeout(function () {
                    autoplayStep();
                }, AUTOPLAY_INTERVAL_MS);
            }

            function go(i, options) {
                const opts = options || {};
                index = Math.max(0, Math.min(urls.length - 1, i));
                frame.src = urls[index];
                updateCounter();
                if (!opts.skipAutoplayReset && autoplayEnabled) {
                    scheduleAutoplay();
                }
            }

            function next() {
                if (index < urls.length - 1) {
                    go(index + 1);
                } else if (loopEnabled) {
                    go(0);
                }
            }

            function prev() {
                if (index > 0) {
                    go(index - 1);
                } else if (loopEnabled) {
                    go(urls.length - 1);
                }
            }

            function autoplayStep() {
                if (index < urls.length - 1) {
                    go(index + 1, { skipAutoplayReset: true });
                    scheduleAutoplay();
                    return;
                }
                if (loopEnabled) {
                    go(0, { skipAutoplayReset: true });
                    scheduleAutoplay();
                    return;
                }
                autoplayEnabled = false;
                updateStatusHud();
            }

            function toggleAutoplay() {
                autoplayEnabled = !autoplayEnabled;
                updateStatusHud();
                if (autoplayEnabled) {
                    scheduleAutoplay();
                } else {
                    clearAutoplayTimer();
                }
            }

            function toggleLoop() {
                loopEnabled = !loopEnabled;
                updateStatusHud();
            }

            function toggleRotate() {
                rotateMode = rotated ? "off" : "on";
                applyScale();
            }

            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    const req = document.documentElement.requestFullscreen;
                    if (req) req.call(document.documentElement).catch(function () {});
                } else {
                    document.exitFullscreen().catch(function () {});
                }
            }

            if (!document.documentElement.requestFullscreen) {
                /* iOS Safari など Fullscreen API 非対応の端末ではボタンを出さない */
                fsBtn.hidden = true;
            }

            window.addEventListener("resize", applyScale);
            window.addEventListener("orientationchange", function () {
                /* 回転直後は寸法が確定していないことがあるので次フレームで測り直す */
                setTimeout(applyScale, 100);
            });
            if (window.visualViewport) {
                window.visualViewport.addEventListener("resize", applyScale);
            }
            applyScale();

            /* --- タッチ：左右スワイプでめくる／左右タップで前後 --- */
            let pointerStart = null;
            touchLayer.addEventListener("pointerdown", function (e) {
                pointerStart = { x: e.clientX, y: e.clientY };
            });
            touchLayer.addEventListener("pointerup", function (e) {
                if (!pointerStart) return;
                const dx = e.clientX - pointerStart.x;
                const dy = e.clientY - pointerStart.y;
                pointerStart = null;
                if (Math.abs(dx) >= SWIPE_MIN_PX && Math.abs(dx) > Math.abs(dy)) {
                    if (dx < 0) next();
                    else prev();
                    return;
                }
                if (Math.abs(dx) <= TAP_MAX_PX && Math.abs(dy) <= TAP_MAX_PX) {
                    /* 画面の左 1/3 を前、それ以外を次に割り当てる */
                    const w = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
                    if (e.clientX < w / 3) prev();
                    else next();
                }
            });
            touchLayer.addEventListener("pointercancel", function () {
                pointerStart = null;
            });

            prevBtn.addEventListener("click", prev);
            nextBtn.addEventListener("click", next);
            rotateBtn.addEventListener("click", toggleRotate);
            autoBtn.addEventListener("click", toggleAutoplay);
            loopBtn.addEventListener("click", toggleLoop);
            fsBtn.addEventListener("click", toggleFullscreen);

            document.addEventListener("keydown", function (e) {
                if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable)) {
                    return;
                }
                switch (e.key) {
                    case "ArrowRight":
                    case "ArrowDown":
                    case "PageDown":
                        e.preventDefault();
                        next();
                        break;
                    case " ":
                        e.preventDefault();
                        next();
                        break;
                    case "ArrowLeft":
                    case "ArrowUp":
                    case "PageUp":
                        e.preventDefault();
                        prev();
                        break;
                    case "Home":
                        e.preventDefault();
                        go(0);
                        break;
                    case "End":
                        e.preventDefault();
                        go(urls.length - 1);
                        break;
                    case "a":
                    case "A":
                        e.preventDefault();
                        toggleAutoplay();
                        break;
                    case "l":
                    case "L":
                        e.preventDefault();
                        toggleLoop();
                        break;
                    case "r":
                    case "R":
                        e.preventDefault();
                        toggleRotate();
                        break;
                    case "f":
                    case "F":
                        e.preventDefault();
                        toggleFullscreen();
                        break;
                    default:
                        break;
                }
            });

            updateStatusHud();
            go(0, { skipAutoplayReset: true });
        })();
    </script>
</body>
</html>
