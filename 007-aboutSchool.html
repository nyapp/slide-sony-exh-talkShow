<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About THL</title>
    <link rel="stylesheet" href="slide-theme-tokens.css">
    <style>
        :root {
            /* tir.ac.jp のブランドトーン */
            --thl-gold: #9f8753;
            --thl-gold-deep: #a58745;
            --thl-text: #404040;
            --eff-bg-slide: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--page-canvas-bg);
            font-family: var(--font-sans);
        }

        .slide {
            width: var(--slide-width);
            height: var(--slide-height);
            background: var(--eff-bg-slide);
            padding: 0;
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            box-shadow: var(--slide-shadow);
            overflow: hidden;
            position: relative;
        }

        .brand {
            padding: 36px 40px 40px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            min-width: 0;
        }

        .pill {
            position: absolute;
            top: 28px;
            left: 36px;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 20px;
            border: 1px solid var(--thl-gold-deep);
            border-radius: 999px;
            background: #ffffff;
            color: var(--thl-gold-deep);
            font-size: 14px;
            font-weight: var(--font-weight-semibold);
            letter-spacing: 0.04em;
            flex-shrink: 0;
        }

        .brand-mark {
            margin: 0;
            font-family: "Times New Roman", "Hiragino Mincho ProN", "Yu Mincho", serif;
            font-size: 72px;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--thl-gold);
            line-height: 1;
        }

        .school-name {
            margin: 14px 0 0;
            font-size: 18px;
            font-weight: var(--font-weight-bold);
            color: var(--thl-text);
            line-height: 1.45;
            letter-spacing: 0.02em;
        }

        .tagline {
            margin: 18px 0 0;
            max-width: 18em;
            font-size: 22px;
            font-weight: var(--font-weight-bold);
            color: var(--thl-text);
            line-height: 1.55;
            letter-spacing: 0.02em;
        }

        .tagline-en {
            margin: 14px 0 0;
            font-size: 13px;
            font-weight: var(--font-weight-semibold);
            letter-spacing: 0.14em;
            color: var(--thl-gold-deep);
            text-transform: uppercase;
        }

        .photo {
            margin: 28px 0;
            min-width: 0;
            min-height: 0;
            height: calc(100% - 56px);
            align-self: center;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .photo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }
    </style>
</head>
<body>
    <div class="slide" role="document" aria-label="学校紹介 THL">
        <div class="pill">About Our School</div>
        <div class="brand">
            <p class="brand-mark" lang="en">THL</p>
            <h1 class="school-name">東京ホテル・ブライダル＆観光専門学校</h1>
            <p class="tagline">高度専門士 4年制・3年制で<br>最高のホスピタリティと<br>おもてなしを学ぶ。</p>
            <p class="tagline-en" lang="en">Hospitality is Globalwork.</p>
        </div>

        <figure class="photo">
            <img
                src="img/thl-campus.jpg"
                width="903"
                height="1350"
                alt="東京ホテル・ブライダル＆観光専門学校の校舎外観"
                decoding="async"
                fetchpriority="high"
            >
        </figure>
    </div>
</body>
</html>
