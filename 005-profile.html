<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Yuki Tamura</title>
    <link rel="stylesheet" href="slide-theme-tokens.css">
    <style>
        :root {
            --eff-accent: #334155;
            --eff-accent-border: #1e293b;
            --eff-text-title: #334155;
            --eff-text-body: #475569;
            --eff-bg-slide: #ffffff;
            --eff-line: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--page-canvas-bg);
            font-family: var(--font-sans);
        }

        .slide {
            width: var(--slide-width);
            height: var(--slide-height);
            background: var(--eff-bg-slide);
            padding: 24px 32px 28px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            box-shadow: var(--slide-shadow);
        }

        .pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 20px;
            border: 1px solid var(--eff-accent-border);
            border-radius: 999px;
            background: #ffffff;
            color: var(--eff-accent);
            font-size: 14px;
            font-weight: var(--font-weight-semibold);
            letter-spacing: 0.02em;
            flex-shrink: 0;
        }

        .hero {
            margin-top: 16px;
            flex: 1;
            width: 100%;
            min-height: 0;
            display: grid;
            grid-template-columns: 0.85fr 1.15fr;
            gap: 36px;
            align-items: stretch;
        }

        .photo {
            margin: 0;
            min-width: 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            overflow: hidden;
        }

        .photo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        .caption {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .name-ja {
            margin: 0;
            font-size: 32px;
            font-weight: var(--font-weight-bold);
            color: var(--eff-text-title);
            line-height: 1.3;
            letter-spacing: 0.06em;
        }

        .name-en {
            margin: 8px 0 0;
            font-size: 14px;
            font-weight: var(--font-weight-semibold);
            color: var(--eff-text-body);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .roles {
            margin: 22px 0 0;
            padding: 0;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .roles li {
            font-size: 15px;
            font-weight: var(--font-weight-bold);
            color: var(--eff-text-title);
            line-height: 1.45;
        }

        .body {
            margin: 18px 0 0;
            padding-top: 16px;
            border-top: 1px solid var(--eff-line);
            font-size: 15px;
            font-weight: var(--font-weight-normal);
            color: var(--eff-text-body);
            line-height: 1.7;
            word-break: auto-phrase;
            text-wrap: pretty;
        }

        .body p {
            margin: 0 0 8px;
        }

        .body p:last-child {
            margin-bottom: 0;
        }

        .gear {
            margin: 16px 0 0;
            padding-top: 14px;
            border-top: 1px solid var(--eff-line);
        }

        .gear-label {
            margin: 0;
            font-size: 14px;
            font-weight: var(--font-weight-bold);
            color: var(--eff-text-title);
            letter-spacing: 0.06em;
        }

        .gear-list {
            margin: 8px 0 0;
            padding: 0;
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
        }

        .gear-list li {
            font-size: 14px;
            font-weight: var(--font-weight-normal);
            color: var(--eff-text-body);
            letter-spacing: 0.02em;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div class="slide" role="document" aria-label="プロフィール 田村勇樹">
        <div class="pill">Profile</div>

        <div class="hero">
            <figure class="photo">
                <img
                    src="img/profile-yuki-tamura.png"
                    width="767"
                    height="1024"
                    alt="田村勇樹のポートレート写真"
                    decoding="async"
                    fetchpriority="high"
                >
            </figure>

            <aside class="caption">
                <h1 class="name-ja">田村 勇樹</h1>
                <p class="name-en" lang="en">Yuki Tamura</p>
                <ul class="roles">
                    <li>プロカメラマン</li>
                </ul>
                <div class="body">
                    <p>プロカメラマンとして、スタジオワークは最大で年間300件。学校関係の撮影にも携わり、人物の空気感を丁寧に切り取るポートレートを得意としています。</p>
                    <p>学校では、アートの歴史と写真技術にフォーカスした授業や、企業プロジェクトに関わっています。企画から制作・展示まで、現場の知見をもとに学生の実践を支援しています。</p>
                </div>
                <div class="gear">
                    <p class="gear-label">主な使用機材</p>
                    <ul class="gear-list">
                        <li>α7 IV</li>
                        <li>α7C II</li>
                        <li>FE 40mm F2.5 G</li>
                        <li>FE 50mm F1.2 GM</li>
                        <li>FE 70-200mm F2.8 GM OSS II</li>
                    </ul>
                </div>
            </aside>
        </div>
    </div>
</body>
</html>
